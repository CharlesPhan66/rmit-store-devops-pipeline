version: "3.8"

services:

  api:
    image: ${ECR}/rmit-api:${GIT_SHA}
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      # Every value below is interpolated from the environment of the
      # `docker stack deploy` command, which Jenkins fills from SSM. Nothing
      # here names an account, a bucket or a load balancer, so redeploying the
      # CloudFormation stacks needs no edit to this file.
      #
      # ALLOWED_HOSTS must contain the ALB's DNS name: prod settings reject any
      # other Host header with 400, and the browser reaches the API through the
      # load balancer. 127.0.0.1 is for the container's own health check.
      ALLOWED_HOSTS: "${ALB_DNS},127.0.0.1"
      USE_S3: "True"
      AWS_STORAGE_BUCKET_NAME: "${MEDIA_BUCKET}"
      AWS_S3_REGION_NAME: "${AWS_REGION}"
      # IN THE ORIGINAL ENV FILE, GIT_COMMIT IS SUPPOSED TO BE SET TO THE GIT SHA OF THE COMMIT THAT BUILT THE IMAGE
      # JENKINS WILL SET THIS ENV VAR AUTOMATICALLY WHEN IT BUILDS THE IMAGE, SO YOU CAN LEAVE IT AS IS
      GIT_COMMIT: ${GIT_SHA}
    secrets:
      # SECRET_KEY & DATABASE_URL ARE REQUIRED IN THE DJANGO ENV
      # BUT USING SWARM CANNOT SET --env-file as COMPOSE DOES
      # So we use secrets (Make sure it's created in the swarm manager first, run docker secret ls to check)
      - SECRET_KEY
      - DATABASE_URL
    networks: [rmit]
    deploy:
      replicas: 3  # Tính luôn manager node
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
        monitor: 30s
      rollback_config:
        parallelism: 1
        delay: 10s
        order: stop-first
      restart_policy:
        condition: on-failure
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz/')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
  
  client:
    image: ${ECR}/rmit-client:${GIT_SHA}
    environment:
      API_BASE_URL: /api
    configs:
      - source: nginx-conf
        target: /etc/nginx/conf.d/default.conf
    ports:
      - "80:80"
    networks: [rmit]
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        order: start-first

secrets:
  # External: Swarm doesn't create it in run-time, it must be created in the swarm manager first by you
  SECRET_KEY:
    external: true
  DATABASE_URL:
    external: true

# This is the same as bind mounting a file in docker-compose
configs:
  nginx-conf:
    file: ../docker/client-nginx-compose.conf

# In compose, networks are created automatically
# In swarm, cuz you have multiple instances as nodes, you need to create an overlay network for the services to communicate across nodes
networks:
  rmit:
    driver: overlay