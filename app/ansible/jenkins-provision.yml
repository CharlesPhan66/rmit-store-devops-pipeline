---
- name: Provision Jenkins CI/CD server
  hosts: jenkins
  become: true

  vars:
    java_version: "21"
    docker_user: "jenkins"

  tasks:

    - name: Update package cache
      dnf:
        update_cache: true

    - name: Install Java 21 (Amazon Corretto)
      dnf:
        name: java-{{ java_version }}-amazon-corretto
        state: present

    - name: Set Java 21 as the default alternative
      alternatives:
        name: java
        path: /usr/lib/jvm/java-{{ java_version }}-amazon-corretto.x86_64/bin/java

    - name: Install Docker
      dnf:
        name: docker
        state: present

    - name: Enable and start Docker
      systemd:
        name: docker
        enabled: true
        state: started

    - name: Add jenkins user to docker group
      user:
        name: "{{ docker_user }}"
        groups: docker
        append: true
      ignore_errors: true

    - name: Add Jenkins yum repository
      get_url:
        url: https://pkg.jenkins.io/redhat-stable/jenkins.repo
        dest: /etc/yum.repos.d/jenkins.repo

    - name: Import Jenkins GPG key
      rpm_key:
        key: https://pkg.jenkins.io/redhat-stable/jenkins.io-2023.key
        state: present

    - name: Install Jenkins
      dnf:
        name: jenkins
        state: present

    - name: Re-add jenkins user to docker group
      user:
        name: "{{ docker_user }}"
        groups: docker
        append: true

    - name: Ensure systemd override directory exists
      file:
        path: /etc/systemd/system/jenkins.service.d
        state: directory
        mode: '0755'

    - name: Override Jenkins systemd unit to force Java 21
      copy:
        dest: /etc/systemd/system/jenkins.service.d/override.conf
        content: |
          [Service]
          Environment="JAVA_HOME=/usr/lib/jvm/java-{{ java_version }}-amazon-corretto.x86_64"
          Environment="PATH=/usr/lib/jvm/java-{{ java_version }}-amazon-corretto.x86_64/bin:/usr/bin:/bin"
        mode: '0644'
      notify: reload systemd and restart jenkins
    - name: Override Jenkins systemd unit to force Java 21
      copy:
        dest: /etc/systemd/system/jenkins.service.d/override.conf
        content: |
          [Service]
          Environment="JAVA_HOME=/usr/lib/jvm/java-{{ java_version }}-amazon-corretto.x86_64"
          Environment="PATH=/usr/lib/jvm/java-{{ java_version }}-amazon-corretto.x86_64/bin:/usr/bin:/bin"
        mode: '0644'
      notify: reload systemd and restart jenkins

    - name: Enable and start Jenkins
      systemd:
        name: jenkins
        enabled: true
        state: started
        daemon_reload: true

  handlers:
    - name: reload systemd and restart jenkins
      systemd:
        daemon_reload: true
        name: jenkins
        state: restarted