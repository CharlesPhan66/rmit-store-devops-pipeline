services:
  database:
    image: postgres:16
    environment:
      POSTGRES_DB: rmit_store
      POSTGRES_USER: rmit
      POSTGRES_PASSWORD: development-password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rmit -d rmit_store"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./server
      dockerfile: ../../docker/api.Dockerfile
    env_file:
      - ./server/.env
    ports:
      - "8000:8000"
    volumes:
      - media_data:/app/media
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build: ./client
    ports:
      - "80:80"
    volumes:
      - ./deploy/config.js:/usr/share/nginx/html/config.js:ro
    depends_on:
      - api

volumes:
  postgres_data:
  media_data:
