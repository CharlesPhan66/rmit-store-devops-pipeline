services:
  db:
    image: postgres:16
    platform: linux/amd64
    environment:
      POSTGRES_USER: rmit
      POSTGRES_PASSWORD: rmit
      POSTGRES_DB: rmit_store
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rmit -d rmit_store"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./server
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://rmit:rmit@db:5432/rmit_store
      SECRET_KEY: compose-dev-secret-key
      ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_SETTINGS_MODULE: config.settings.dev
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz/')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build: ./client
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./config.js:/usr/share/nginx/html/config.js:ro
    ports:
      - "8081:80"

volumes:
  pgdata: