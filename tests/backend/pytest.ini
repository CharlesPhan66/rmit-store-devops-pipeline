[pytest]
DJANGO_SETTINGS_MODULE = tests.backend.test_settings
pythonpath = ../.. app/server
python_files = test_*.py *_tests.py tests.py
addopts = 
    --strict-markers 
    -p no:warnings
    --cov=apps
    --cov-report=term-missing
    --cov-report=xml:reports/coverage-backend.xml
    --cov-report=html:reports/coverage-html

markers =
    unit: do not require database and network, can run in isolation
    integration: can use database
    smoke: run when an URL is requested, but not the full test suite
    e2e: end-to-end acceptance tests