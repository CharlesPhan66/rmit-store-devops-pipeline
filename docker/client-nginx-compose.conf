# nginx config for the Compose stack (Plan E), mounted over the image's own
# default.conf by docker-compose.yml.
#
# This is Plan B's rmit-store.conf again: one nginx owning the single port,
# serving the SPA from disk and proxying everything else to Django. Same shape,
# because the topology is the same - client and API on one host, one origin, so
# CORS never comes up.
#
# Two things differ, and both follow from nginx now being in its own container:
#
#   1. proxy_pass goes to the service name `api`, not 127.0.0.1. There is no
#      gunicorn on this container's loopback.
#   2. /static/ and /media/ are proxied instead of served with `alias`. Plan B
#      could read them off disk because nginx and Django shared a filesystem.
#      These containers do not.

server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # nginx rejects a request body over 1 MB with a 413 by default, before
    # Django ever sees it, so the API log stays completely silent. Product
    # images are bigger than that, and uploading one is how the media exercise
    # is triggered.
    client_max_body_size 10M;

    # Docker's embedded DNS server.
    #
    # This line is what makes `--scale api=2` mean anything. nginx resolves a
    # literal name in proxy_pass ONCE, at startup, and pins every later request
    # to that one address - a second replica would receive nothing, and the
    # media exercise would show 0% failures instead of 50%. Resolving through a
    # variable defers the lookup to request time, and `valid=10s` keeps it fresh
    # as replicas come and go.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Set once here; every proxying location below inherits these.
    #
    # Host uses $http_host, not Plan B's $host. $host drops the port, and this
    # stack is published on 8080. Django builds absolute media URLs from the
    # incoming Host header, so with $host it would hand back
    # http://localhost/media/... - a URL pointing at a port nothing serves.
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # The SPA routes on the client; a refresh at /products/42 must return
    # index.html rather than a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Configuration, not code: an edit has to take effect on the next load.
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    # Content-hashed filenames, so caching forever is safe.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The same four prefixes as Plan B. /admin/ belongs here too: without it the
    # Django admin falls into `location /` above, which cheerfully answers with
    # index.html and leaves you looking at the SPA's 404 page.
    location ~ ^/(api|admin|healthz|readyz)(/|$) {
        set $upstream_api http://api:8000;
        proxy_pass $upstream_api;
    }

    # Plan B used `alias` here and warned that proxying /media/ to gunicorn
    # returns 404. That warning holds under prod settings: config/urls.py only
    # routes MEDIA_URL when DEBUG is on. It works here because the Compose dev
    # stack runs config.settings.dev.
    #
    # In docker-compose.prod.yml this block receives no traffic at all: with
    # USE_S3=true the browser fetches images straight from the bucket.
    location /media/ {
        set $upstream_media http://api:8000;
        proxy_pass $upstream_media;
    }

    # Plan B used `alias` here too. Proxied instead, so whitenoise inside the
    # API container serves the collected static files - which is why
    # collectstatic runs at image build time.
    location /static/ {
        set $upstream_static http://api:8000;
        proxy_pass $upstream_static;
    }

    # This container's own health, independent of whether the API is up.
    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
