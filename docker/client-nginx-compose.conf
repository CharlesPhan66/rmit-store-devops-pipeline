# nginx config for the Compose stack, mounted over the image's own
# default.conf by docker-compose.yml.
#
# This is Plan B's rmit-store.conf again: one nginx owning the single port,
# serving the SPA from disk and proxying everything else to Django. Same shape,
# because the topology is the same - client and API on one host, one origin, so
# CORS never comes up.
#
# Two things differ, and both follow from nginx now being in its own container:
#
#   1. proxy_pass goes to the service name `api`, not 127.0.0.1. There is no
#      gunicorn on this container's loopback.
#   2. /static/ and /media/ are proxied instead of served with `alias`. Plan B
#      could read them off disk because nginx and Django shared a filesystem.
#      These containers do not.

# Why we need to bind mount this file instead of building it into the image?
# As we need to use one image for both dev, prod, and so on environments, we cannot bake in a config that is specific to one environment.
# The nginx image is generic, and the config is specific to the Compose stack.  (CHARLES research)

server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Already explained in by plan b's nginx config
    client_max_body_size 10M;

    # Docker's embedded DNS server.
    #
    # Tell nginx to use the Docker embedded DNS server, so ut can resolve the service names to the correct container IPs.
    # Basically, nginx doesn't know how to resolve something like http://api:8000, "What is api here?"
    # 127.0.0.11 is the Docker embedded DNS server, which knows how to resolve service names to container IPs.
    # valid=10s means that nginx will cache the DNS resolution for 10 seconds. Why? Because the container IPs can change, and we want nginx to re-resolve them periodically.
    # ipv6=off means that nginx will not use IPv6 for DNS resolution. This is because the Docker embedded DNS server does not support IPv6, and we don't want nginx to try to use it.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Set once here; every proxying location below inherits these.
    #
    # Host uses $http_host, not Plan B's $host. $host drops the port, and this
    # stack is published on 8080. Django builds absolute media URLs from the
    # incoming Host header, so with $host it would hand back
    # http://localhost/media/... - a URL pointing at a port nothing serves.
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # The SPA routes on the client; a refresh at /products/42 must return
    # index.html rather than a 404.
    # Same as plan B
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Configuration, not code: an edit has to take effect on the next load.
    # Same as plan B
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    # Content-hashed filenames, so caching forever is safe.
    # same as plan B
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The API, admin, and health endpoints are all served by the same gunicorn
    # inside the api container. The SPA is served by nginx on this container.
    # Same as plan B, but it proxies to the service name `api` instead of the IP address
    # The `api` service name is resolved by Docker's embedded DNS server to the correct container IP.
    location ~ ^/(api|admin|healthz|readyz)(/|$) {
        set $upstream_api http://api:8000;
        proxy_pass $upstream_api;
    }

    # Same as above, but for static and media files.
    #
    # In docker-compose.prod.yml this block receives no traffic at all: with
    # USE_S3=true the browser fetches images straight from the bucket.
    # If use S3, what returns from the API is a URL pointing at S3, not a /media/ path on this nginx.
    location /media/ {
        set $upstream_media http://api:8000;
        proxy_pass $upstream_media;
    }

    # Find static files in the API container, not on this nginx container.
    # The SPA is served from this nginx container, but the static files are served from the API container.
    location /static/ {
        set $upstream_static http://api:8000;
        proxy_pass $upstream_static;
    }

    # This container's own health, independent of whether the API is up.
    # Customers can hit /healthz to see if the nginx container is up, and /readyz to see if the API is up.
    # OR hit /nginx-health to see if the nginx container is up
    # This is optional, but it is a good practice to have a health check endpoint for the nginx container itself.
    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
