server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10M;

    # Runtime configuration must be revalidated on every request.
    location = /config.js {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # Vite hashes these filenames, so long-lived caching is safe.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Used by the local Compose mode. With S3 enabled, image URLs point to S3
    # and requests never reach this location.
    location /media/ {
        alias /srv/media/;
        access_log off;
        expires 7d;
    }

    # Vue history-mode routes must return index.html on direct navigation.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
