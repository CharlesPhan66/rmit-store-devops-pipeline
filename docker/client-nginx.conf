# Replaces the stock default.conf in the nginx image.
#
# Just the same as config file for nginx that we work on plan B and C,
# now we have it here to put it into the container running client + nginx while buidling

# Author: Charles

server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # The SPA routes on the client. A refresh at /products/42 asks nginx for a
    # file that does not exist; it must answer with index.html and let Vue
    # resolve the path. Without this line, every deep link is a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # config.js is configuration, not code. An edit has to take effect on the
    # next page load, so it must never be cached.
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    # Files under /assets/ carry a content hash in the name (index-a3f9.js).
    # New content means a new filename, so caching forever is safe.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # A probe for this container that does not depend on the API being up.
    # Use it as the ALB target group health check for the frontend tier.
    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
