name: rmit-store

x-api-image: &api-image
  image: ${API_IMAGE_REPOSITORY:-rmit-api}:${IMAGE_TAG:-local}
  build:
    context: .
    dockerfile: docker/api.Dockerfile
    target: runtime
    args:
      APP_VERSION: ${APP_VERSION:-1.0.0}
      GIT_COMMIT: ${GIT_COMMIT:-dev}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rmit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: rmit_store
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rmit -d rmit_store"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    <<: *api-image
    command: ["python", "manage.py", "migrate", "--noinput"]
    env_file:
      - ./compose.env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *api-image
    env_file:
      - ./compose.env
    volumes:
      - media_data:/app/media
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz/', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  client:
    image: ${CLIENT_IMAGE_REPOSITORY:-rmit-client}:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: docker/client.Dockerfile
      target: runtime
    volumes:
      - ./docker/client-nginx-compose.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/client-config.compose.js:/usr/share/nginx/html/config.js:ro
      - media_data:/srv/media:ro
    ports:
      - "${CLIENT_PORT:-8081}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  media_data:
