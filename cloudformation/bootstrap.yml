AWSTemplateFormatVersion: "2010-09-09"
Description: >
  RMIT Store - the Ansible control node, on its own.

  Deploy after network.yml.

  It is separate from compute.yml to break a dependency cycle: compute.yml needs
  the control node's public key, and that key is generated on the control node.
  In the old compute.yml, it was set up at the same time as the compute nodes,
  which meant that compute.yml had to be deployed twice: once to create the control node and generate the key,
  and again to create the compute nodes with the key. Now compute.yml can be deployed once, after this stack is up and the key is in SSM.
  Deploy this first. Its user data generates the key and publishes the public
  key to SSM at /rmit/ANSIBLE_PUBKEY; compute.yml reads that parameter, so no
  human ever copies a key around.

Parameters:
  # This assumes that you have already deployed the network stack with stack name rmit-network (You should)
  # If you have it named differently, you can pass in the name of the network stack when creating this stack.
  #
  # Example:
  # You deploy the network stack with name rmit-network-test
  # aws cloudformation deploy \
  # --stack-name rmit-network-test \
  # --template-file cloudformation/network.yml \
  # --parameter-overrides AdminCidr="YOUR_IP/32"
  #
  # Then if you don't pass the same name in when creating this stack, it will fallback to the default name rmit-network,
  # and the stack will fail to create because it can't find the resources it needs from the network stack.
  #
  # Then you need to:
  #
  # aws cloudformation deploy \
  # --stack-name rmit-bootstrap \
  # --template-file cloudformation/bootstrap.yml \
  # --parameter-overrides \
  #   NetworkStackName=rmit-network-test \
  #   KeyPairName=rmit-keypair
  NetworkStackName:
    Type: String
    Default: rmit-network
    Description: Name of the network stack, for the security group and subnet

  KeyPairName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: >
      The EC2 key pair, kept only as a way in for a human when something goes
      wrong. The Ansible key is generated by user data, so nothing in the normal
      flow uses this.

  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

Resources:
  # Create the Ansible control node
  # The security group and subnet are imported from the network stack, so this template owns no network policy of its own.
  AnsibleServer:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.micro
      ImageId: !Ref LatestAmiId
      KeyName: !Ref KeyPairName
      # Needed for the aws_ec2 dynamic inventory (ec2:DescribeInstances) and
      # for the aws_ssm lookups the playbooks use.
      IamInstanceProfile: LabInstanceProfile
      SubnetId: !ImportValue
        Fn::Sub: "${NetworkStackName}-PublicSubnet1"
      SecurityGroupIds:
        - !ImportValue
            Fn::Sub: "${NetworkStackName}-AnsibleSg"
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 8
            VolumeType: gp3
      Tags:
        - Key: Name
          Value: ansible-server
        - Key: Role
          Value: ansible
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -euxo pipefail
          hostnamectl set-hostname ansible-server
          echo "preserve_hostname: true" >> /etc/cloud/cloud.cfg

          # Install the necessary packages
          dnf update -y
          dnf install -y git ansible python3-boto3

          KEY=/home/ec2-user/.ssh/ansible_rmit
          install -d -m 700 -o ec2-user -g ec2-user /home/ec2-user/.ssh
          if [ ! -f "$KEY" ]; then
            sudo -u ec2-user ssh-keygen -t ed25519 -f "$KEY" -N "" -C "ansible-control"
          fi

          REGION=$(curl -s -H "X-aws-ec2-metadata-token: $(curl -sX PUT \
            -H 'X-aws-ec2-metadata-token-ttl-seconds: 60' \
            http://169.254.169.254/latest/api/token)" \
            http://169.254.169.254/latest/meta-data/placement/region)

          aws ssm put-parameter --region "$REGION" \
            --name /rmit/ANSIBLE_PUBKEY --type String --overwrite \
            --value "$(cat ${KEY}.pub)"

          # Record the time of completion
          echo "user-data completed $(date -Is)" > /etc/motd

Outputs:

  AnsibleServerPublicIp:
    Description: SSH here to generate the control-node key and run playbooks
    Value: !GetAtt AnsibleServer.PublicIp

  NextStep:
    Description: What to do once this stack is up
    Value: >-
      Wait for /rmit/ANSIBLE_PUBKEY to appear in SSM, then deploy data.yml and
      compute.yml. No SSH needed: compute.yml reads the key from SSM itself.
