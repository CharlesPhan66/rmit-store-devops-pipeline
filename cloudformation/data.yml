AWSTemplateFormatVersion: "2010-09-09"
Description: RMIT Store durable resources (RDS, S3, ECR)

Parameters:
  NetworkStackName:
    Type: String
    Default: rmit-network
    Description: >
      Name of the network stack. Every security group and subnet is imported
      from it, so this template owns no network policy of its own.
  DbPassword:
    Type: String
    NoEcho: true
    MinLength: 8
  MediaBucketName:
    Type: String

Resources:

  # S3
  # The Bucket name will be set to the value of the MediaBucketName parameter passed in when creating the stack
  MediaBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    Properties:
      BucketName: !Ref MediaBucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false

  # Policy to allow public read and write access to the S3 bucket
  MediaBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref MediaBucket
      PolicyDocument:
        Statement:
          - Sid: PublicReadMediaBucket
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "arn:aws:s3:::${MediaBucket}/media/*"

  # Staging gets a bucket of its own rather than a prefix inside the production
  # one. A prefix would have been tidier, but the storage backend hardcodes
  # "location": "media" in app/server/config/settings/base.py and that file
  # belongs to the vendored application, which we do not edit. Only
  # AWS_STORAGE_BUCKET_NAME is environment-driven, so the split has to happen
  # one level up.
  #
  # No DeletionPolicy: Retain here, unlike production. Staging media is
  # regenerated by seed_demo on every deploy, so keeping it after a teardown
  # would leave nothing but orphans blocking the next create.
  StagingMediaBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${MediaBucketName}-staging"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false

  StagingMediaBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref StagingMediaBucket
      PolicyDocument:
        Statement:
          - Sid: PublicReadStagingMediaBucket
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "arn:aws:s3:::${StagingMediaBucket}/media/*"

  # ECR
  # just like the repo rmit-api that has been created manually
  ApiRepo:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    Properties:
      RepositoryName: rmit-api
      ImageTagMutability: MUTABLE
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep only the last 10 images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 10
                },
                "action": {
                  "type": "expire"
                }
              }
            ]
          }

  # Same as rmit-client repo that has been created manually, but we will create it here so that it can be deleted when the stack is deleted
  ClientRepo:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    Properties:
      RepositoryName: rmit-client
      ImageTagMutability: MUTABLE
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep only the last 10 images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 10
                },
                "action": {
                  "type": "expire"
                }
              }
            ]
          }

  # RDS
  # We import the sg and the private subnets from the network stack, so we don't have to create them here
  # This is because the RDS instance needs to be in a private subnet, which has no route to the internet, so we can skip a NAT gateway.
  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: RMIT Store database subnets
      SubnetIds:
        - !ImportValue
            Fn::Sub: "${NetworkStackName}-PrivateSubnet1"
        - !ImportValue
            Fn::Sub: "${NetworkStackName}-PrivateSubnet2"

  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    Properties:
      DBInstanceIdentifier: rmit-store
      DBName: rmit_store
      Engine: postgres
      EngineVersion: "16"
      DBInstanceClass: db.t3.micro
      AllocatedStorage: 20
      MasterUsername: rmit
      MasterUserPassword: !Ref DbPassword
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups:
        - !ImportValue
            Fn::Sub: "${NetworkStackName}-DbSg"
      PubliclyAccessible: false
      BackupRetentionPeriod: 0

  MediaBucketParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /rmit/prod/MEDIA_BUCKET
      Type: String
      Value: !Ref MediaBucket

  StagingMediaBucketParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /rmit/staging/MEDIA_BUCKET
      Type: String
      Value: !Ref StagingMediaBucket

  EcrRegistryParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /rmit/ECR_REGISTRY
      Type: String
      Value: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com"

  RdsEndpointParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /rmit/RDS_ENDPOINT
      Type: String
      Value: !GetAtt Database.Endpoint.Address

Outputs:
  RdsEndpoint:
    Value: !GetAtt Database.Endpoint.Address
  MediaBucket:
    Value: !Ref MediaBucket
  StagingMediaBucket:
    Value: !Ref StagingMediaBucket