AWSTemplateFormatVersion: "2010-09-09"
Description: >
  RMIT Store: Compute Resources, exclude security groups, and other config/network resources. Deleting this stack leaves RDS, S3 and ECR
  untouched, which is what makes a teardown-and-rebuild demo safe to run.

  Deploy last. Every subnet and security group is imported from network.yml, and
  the Ansible control node's public key comes from the SSM parameter that
  bootstrap.yml publishes

  Check SSM for the public key at /rmit/ANSIBLE_PUBKEY. If you need to rebuild the control node, you can delete that parameter and redeploy bootstrap.yml to generate a new key

Parameters:
  NetworkStackName:
    Type: String
    Default: rmit-network
    Description: >
      Name of the network stack. Every subnet and security group comes from
      there, so this template owns no network policy at all.

  KeyPairName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Existing key pair, for the one-off human SSH

  ControlNodePubKey:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /rmit/ANSIBLE_PUBKEY
    Description: >
      SSM parameter holding the Ansible control node's public key. Leave the
      default unless you renamed the parameter. Installing it is the only thing
      user data does on the five machines below: enough for Ansible to take
      over, nothing more.

  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: >
      Resolved by AWS at deploy time. Never hard-code an AMI id: it differs per
      region and changes as new images are published.

Resources:
  JenkinsServer:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.small
      ImageId: !Ref LatestAmiId
      KeyName: !Ref KeyPairName
      IamInstanceProfile: LabInstanceProfile
      SubnetId: !ImportValue
        Fn::Sub: "${NetworkStackName}-PublicSubnet1"
      SecurityGroupIds:
        - !ImportValue
            Fn::Sub: "${NetworkStackName}-JenkinsSg"
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 20
            VolumeType: gp3
      Tags:
        - Key: Name
          Value: jenkins-server
        - Key: Role
          Value: jenkins
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          hostnamectl set-hostname jenkins-server
          echo "preserve_hostname: true" >> /etc/cloud/cloud.cfg
          install -d -m 700 -o ec2-user -g ec2-user /home/ec2-user/.ssh
          echo "${ControlNodePubKey}" >> /home/ec2-user/.ssh/authorized_keys
          chown ec2-user:ec2-user /home/ec2-user/.ssh/authorized_keys
          chmod 600 /home/ec2-user/.ssh/authorized_keys
          echo "user-data completed $(date -Is)" > /etc/motd

  StagingServer:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.small
      ImageId: !Ref LatestAmiId
      KeyName: !Ref KeyPairName
      IamInstanceProfile: LabInstanceProfile
      SubnetId: !ImportValue
        Fn::Sub: "${NetworkStackName}-PublicSubnet1"
      SecurityGroupIds:
        - !ImportValue
            Fn::Sub: "${NetworkStackName}-StagingSg"
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 16
            VolumeType: gp3
      Tags:
        - Key: Name
          Value: staging-server
        - Key: Role
          Value: staging
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          hostnamectl set-hostname staging-server
          echo "preserve_hostname: true" >> /etc/cloud/cloud.cfg
          install -d -m 700 -o ec2-user -g ec2-user /home/ec2-user/.ssh
          echo "${ControlNodePubKey}" >> /home/ec2-user/.ssh/authorized_keys
          chown ec2-user:ec2-user /home/ec2-user/.ssh/authorized_keys
          chmod 600 /home/ec2-user/.ssh/authorized_keys
          echo "user-data completed $(date -Is)" > /etc/motd

  SwarmManager:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.small
      ImageId: !Ref LatestAmiId
      KeyName: !Ref KeyPairName
      IamInstanceProfile: LabInstanceProfile
      SubnetId: !ImportValue
        Fn::Sub: "${NetworkStackName}-PublicSubnet1"
      SecurityGroupIds:
        - !ImportValue
            Fn::Sub: "${NetworkStackName}-SwarmSg"
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 16
            VolumeType: gp3
      Tags:
        - Key: Name
          Value: swarm-mgr
        - Key: Role
          Value: swarm-manager
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          hostnamectl set-hostname swarm-mgr
          echo "preserve_hostname: true" >> /etc/cloud/cloud.cfg
          install -d -m 700 -o ec2-user -g ec2-user /home/ec2-user/.ssh
          echo "${ControlNodePubKey}" >> /home/ec2-user/.ssh/authorized_keys
          chown ec2-user:ec2-user /home/ec2-user/.ssh/authorized_keys
          chmod 600 /home/ec2-user/.ssh/authorized_keys
          echo "user-data completed $(date -Is)" > /etc/motd

  SwarmWorker1:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.small
      ImageId: !Ref LatestAmiId
      KeyName: !Ref KeyPairName
      IamInstanceProfile: LabInstanceProfile
      SubnetId: !ImportValue
        Fn::Sub: "${NetworkStackName}-PublicSubnet1"
      SecurityGroupIds:
        - !ImportValue
            Fn::Sub: "${NetworkStackName}-SwarmSg"
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 16
            VolumeType: gp3
      Tags:
        - Key: Name
          Value: swarm-w1
        - Key: Role
          Value: swarm-worker
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          hostnamectl set-hostname swarm-w1
          echo "preserve_hostname: true" >> /etc/cloud/cloud.cfg
          install -d -m 700 -o ec2-user -g ec2-user /home/ec2-user/.ssh
          echo "${ControlNodePubKey}" >> /home/ec2-user/.ssh/authorized_keys
          chown ec2-user:ec2-user /home/ec2-user/.ssh/authorized_keys
          chmod 600 /home/ec2-user/.ssh/authorized_keys
          echo "user-data completed $(date -Is)" > /etc/motd

  SwarmWorker2:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.small
      ImageId: !Ref LatestAmiId
      KeyName: !Ref KeyPairName
      IamInstanceProfile: LabInstanceProfile
      SubnetId: !ImportValue
        Fn::Sub: "${NetworkStackName}-PublicSubnet1"
      SecurityGroupIds:
        - !ImportValue
            Fn::Sub: "${NetworkStackName}-SwarmSg"
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 16
            VolumeType: gp3
      Tags:
        - Key: Name
          Value: swarm-w2
        - Key: Role
          Value: swarm-worker
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          hostnamectl set-hostname swarm-w2
          echo "preserve_hostname: true" >> /etc/cloud/cloud.cfg
          install -d -m 700 -o ec2-user -g ec2-user /home/ec2-user/.ssh
          echo "${ControlNodePubKey}" >> /home/ec2-user/.ssh/authorized_keys
          chown ec2-user:ec2-user /home/ec2-user/.ssh/authorized_keys
          chmod 600 /home/ec2-user/.ssh/authorized_keys
          echo "user-data completed $(date -Is)" > /etc/motd

  # Load balancer

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: swarm-tg
      VpcId: !ImportValue
        Fn::Sub: "${NetworkStackName}-VpcId"
      Port: 80
      Protocol: HTTP
      TargetType: instance
      HealthCheckPath: /nginx-health
      HealthCheckProtocol: HTTP
      HealthCheckIntervalSeconds: 15
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: "200"
      Targets:
        - Id: !Ref SwarmManager
        - Id: !Ref SwarmWorker1
        - Id: !Ref SwarmWorker2

  Alb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: rmit-alb
      Scheme: internet-facing
      Type: application
      IpAddressType: ipv4
      SecurityGroups:
        - !ImportValue
            Fn::Sub: "${NetworkStackName}-AlbSg"
      Subnets:
        - !ImportValue
            Fn::Sub: "${NetworkStackName}-PublicSubnet1"
        - !ImportValue
            Fn::Sub: "${NetworkStackName}-PublicSubnet2"

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  AlbDnsParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /rmit/prod/ALB_DNS
      Type: String
      Value: !GetAtt Alb.DNSName

  SwarmMgrIpParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /rmit/prod/SWARM_MGR_IP
      Type: String
      Value: !GetAtt SwarmManager.PrivateIp

  StagingIpParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /rmit/staging/PRIVATE_IP
      Type: String
      Value: !GetAtt StagingServer.PrivateIp

  JenkinsIpParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /rmit/JENKINS_PRIVATE_IP
      Type: String
      Value: !GetAtt JenkinsServer.PrivateIp

  JenkinsEip:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      InstanceId: !Ref JenkinsServer
      Tags:
        - Key: Name
          Value: jenkins-eip

  JenkinsPublicIpParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /rmit/JENKINS_PUBLIC_IP
      Type: String
      Value: !Ref JenkinsEip

Outputs:

  AlbDns:
    Description: Public address of the production site
    Value: !GetAtt Alb.DNSName

  JenkinsUrl:
    Description: Jenkins UI, and the host half of the GitHub webhook URL
    Value: !Sub "http://${JenkinsEip}:8080"

  StagingUrl:
    Value: !Sub "http://${StagingServer.PublicIp}:8081"

  SwarmManagerPrivateIp:
    Value: !GetAtt SwarmManager.PrivateIp
