AWSTemplateFormatVersion: "2010-09-09"
Description: >
  RMIT Store: Compute Resources, exclude security groups, and other config/network resources. Deleting this stack leaves RDS, S3 and ECR
  untouched, which is what makes a teardown-and-rebuild demo safe to run.

  Deploy last. Every subnet and security group is imported from network.yml, and
  the Ansible control node's public key comes from the SSM parameter that
  bootstrap.yml publishes

  Check SSM for the public key at /rmit/ANSIBLE_PUBKEY. If you need to rebuild the control node, you can delete that parameter and redeploy bootstrap.yml to generate a new key

Parameters:
  NetworkStackName:
    Type: String
    Default: rmit-network
    Description: >
      Name of the network stack. Every subnet and security group comes from
      there, so this template owns no network policy at all.

  KeyPairName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Existing key pair, for the one-off human SSH

  ControlNodePubKey:
    # Resolved from SSM at deploy time, not typed. bootstrap.yml's user data
    # generates the key on the control node and publishes the public half here
    # thanks to this, ansible can take over the five machines below without a human ever copying a key around
    Type: AWS::SSM::Parameter::Value<String>
    Default: /rmit/ANSIBLE_PUBKEY
    Description: >
      SSM parameter holding the Ansible control node's public key. Leave the
      default unless you renamed the parameter. Installing it is the only thing
      user data does on the five machines below: enough for Ansible to take
      over, nothing more.

  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: >
      Resolved by AWS at deploy time. Never hard-code an AMI id: it differs per
      region and changes as new images are published.

Resources:

  # Instances
  #
  # Five machines. The sixth, the Ansible control node, lives in
  # bootstrap.yml because this stack needs its key, then it need deplpoyed first
  #
  # Every one carries two tags. Name is for humans; Role is what the
  # aws_ec2 dynamic inventory groups machines by. The Role tag is what Ansible uses to know which playbook to run on which machine.
  #
  # User data does ONE thing: install the control node's public key. Every
  # package, service and file is Ansible's job, because user data runs once
  # at first boot and can never be re-run.
  # We don't want to repeat the phase of install docker, install docker-compose, install nginx, install python3, install pip, install git, etc.
  # We want to use Ansible to manage the configuration of the instances, so we can easily update them and keep them consistent.
  # So once the instances are up, all instances are blank with only the control node's public key. Therefore, we can run the Ansible playbooks to configure them.

  JenkinsServer:
    Type: AWS::EC2::Instance
    Properties:
      # Builds run here. `npm run build` in the client image is the one step
      # that genuinely needs the memory, and /tmp is a tmpfs at 50% of RAM.
      InstanceType: t3.small
      ImageId: !Ref LatestAmiId
      KeyName: !Ref KeyPairName
      IamInstanceProfile: LabInstanceProfile
      SubnetId: !ImportValue
        Fn::Sub: "${NetworkStackName}-PublicSubnet1"
      SecurityGroupIds:
        - !ImportValue
            Fn::Sub: "${NetworkStackName}-JenkinsSg"
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 20
            VolumeType: gp3
      Tags:
        - Key: Name
          Value: jenkins-server
        - Key: Role
          Value: jenkins
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          hostnamectl set-hostname jenkins-server
          echo "preserve_hostname: true" >> /etc/cloud/cloud.cfg
          install -d -m 700 -o ec2-user -g ec2-user /home/ec2-user/.ssh
          echo "${ControlNodePubKey}" >> /home/ec2-user/.ssh/authorized_keys
          chown ec2-user:ec2-user /home/ec2-user/.ssh/authorized_keys
          chmod 600 /home/ec2-user/.ssh/authorized_keys
          echo "user-data completed $(date -Is)" > /etc/motd

  StagingServer:
    Type: AWS::EC2::Instance
    Properties:
      # Runs containers, builds nothing. gunicorn workers are forks and share
      # most of their memory, so the Compose stack fits comfortably.
      InstanceType: t3.micro
      ImageId: !Ref LatestAmiId
      KeyName: !Ref KeyPairName
      IamInstanceProfile: LabInstanceProfile
      SubnetId: !ImportValue
        Fn::Sub: "${NetworkStackName}-PublicSubnet1"
      SecurityGroupIds:
        - !ImportValue
            Fn::Sub: "${NetworkStackName}-StagingSg"
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 16
            VolumeType: gp3
      Tags:
        - Key: Name
          Value: staging-server
        - Key: Role
          Value: staging
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          hostnamectl set-hostname staging-server
          echo "preserve_hostname: true" >> /etc/cloud/cloud.cfg
          install -d -m 700 -o ec2-user -g ec2-user /home/ec2-user/.ssh
          echo "${ControlNodePubKey}" >> /home/ec2-user/.ssh/authorized_keys
          chown ec2-user:ec2-user /home/ec2-user/.ssh/authorized_keys
          chmod 600 /home/ec2-user/.ssh/authorized_keys
          echo "user-data completed $(date -Is)" > /etc/motd

  SwarmManager:
    Type: AWS::EC2::Instance
    Properties:
      # Small, not micro, because failure here is not self-healing: a worker
      # that dies has its tasks rescheduled, while a dead manager means no
      # deploys, no scaling and no rollback. It also carries the raft store and
      # is where migrate and stack deploy are run from.
      InstanceType: t3.small
      ImageId: !Ref LatestAmiId
      KeyName: !Ref KeyPairName
      IamInstanceProfile: LabInstanceProfile
      SubnetId: !ImportValue
        Fn::Sub: "${NetworkStackName}-PublicSubnet1"
      SecurityGroupIds:
        - !ImportValue
            Fn::Sub: "${NetworkStackName}-SwarmSg"
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 16
            VolumeType: gp3
      Tags:
        - Key: Name
          Value: swarm-mgr
        - Key: Role
          Value: swarm-manager
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          hostnamectl set-hostname swarm-mgr
          echo "preserve_hostname: true" >> /etc/cloud/cloud.cfg
          install -d -m 700 -o ec2-user -g ec2-user /home/ec2-user/.ssh
          echo "${ControlNodePubKey}" >> /home/ec2-user/.ssh/authorized_keys
          chown ec2-user:ec2-user /home/ec2-user/.ssh/authorized_keys
          chmod 600 /home/ec2-user/.ssh/authorized_keys
          echo "user-data completed $(date -Is)" > /etc/motd

  SwarmWorker1:
    Type: AWS::EC2::Instance
    Properties:
      # Workers only run tasks. If one dies, Swarm reschedules its share.
      InstanceType: t3.micro
      ImageId: !Ref LatestAmiId
      KeyName: !Ref KeyPairName
      IamInstanceProfile: LabInstanceProfile
      SubnetId: !ImportValue
        Fn::Sub: "${NetworkStackName}-PublicSubnet1"
      SecurityGroupIds:
        - !ImportValue
            Fn::Sub: "${NetworkStackName}-SwarmSg"
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 16
            VolumeType: gp3
      Tags:
        - Key: Name
          Value: swarm-w1
        - Key: Role
          Value: swarm-worker
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          hostnamectl set-hostname swarm-w1
          echo "preserve_hostname: true" >> /etc/cloud/cloud.cfg
          install -d -m 700 -o ec2-user -g ec2-user /home/ec2-user/.ssh
          echo "${ControlNodePubKey}" >> /home/ec2-user/.ssh/authorized_keys
          chown ec2-user:ec2-user /home/ec2-user/.ssh/authorized_keys
          chmod 600 /home/ec2-user/.ssh/authorized_keys
          echo "user-data completed $(date -Is)" > /etc/motd

  SwarmWorker2:
    Type: AWS::EC2::Instance
    Properties:
      # Workers only run tasks. If one dies, Swarm reschedules its share.
      InstanceType: t3.micro
      ImageId: !Ref LatestAmiId
      KeyName: !Ref KeyPairName
      IamInstanceProfile: LabInstanceProfile
      SubnetId: !ImportValue
        Fn::Sub: "${NetworkStackName}-PublicSubnet1"
      SecurityGroupIds:
        - !ImportValue
            Fn::Sub: "${NetworkStackName}-SwarmSg"
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 16
            VolumeType: gp3
      Tags:
        - Key: Name
          Value: swarm-w2
        - Key: Role
          Value: swarm-worker
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          hostnamectl set-hostname swarm-w2
          echo "preserve_hostname: true" >> /etc/cloud/cloud.cfg
          install -d -m 700 -o ec2-user -g ec2-user /home/ec2-user/.ssh
          echo "${ControlNodePubKey}" >> /home/ec2-user/.ssh/authorized_keys
          chown ec2-user:ec2-user /home/ec2-user/.ssh/authorized_keys
          chmod 600 /home/ec2-user/.ssh/authorized_keys
          echo "user-data completed $(date -Is)" > /etc/motd

  # Load balancer

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: swarm-tg
      VpcId: !ImportValue
        Fn::Sub: "${NetworkStackName}-VpcId"
      Port: 80
      Protocol: HTTP
      TargetType: instance
      # It's different from /healthz, which is answered by Django and is used by the
      # load balancer to determine if the Django app is healthy. /nginx-health
      # is used by the load balancer to determine if the nginx reverse proxy is
      # healthy
      # That matters because the load balancer calls targets by their PRIVATE
      # IP: a health check that hit Django would arrive with Host: 172.31.x.x,
      # get 400 DisallowedHost, and the target would be pulled out of rotation.
      HealthCheckPath: /nginx-health
      HealthCheckProtocol: HTTP
      HealthCheckIntervalSeconds: 15
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: "200"
      # Every node, including ones running no client replica: Swarm's routing
      # mesh publishes port 80 on all of them and forwards internally.
      Targets:
        - Id: !Ref SwarmManager
        - Id: !Ref SwarmWorker1
        - Id: !Ref SwarmWorker2

  Alb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: rmit-alb
      Scheme: internet-facing
      Type: application
      IpAddressType: ipv4
      SecurityGroups:
        - !ImportValue
            Fn::Sub: "${NetworkStackName}-AlbSg"
      Subnets:
        - !ImportValue
            Fn::Sub: "${NetworkStackName}-PublicSubnet1"
        - !ImportValue
            Fn::Sub: "${NetworkStackName}-PublicSubnet2"

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  # Addresses, published to SSM
  #
  # This is what lets Jenkinsfile and the Ansible group_vars stop
  # hard-coding IPs: they read these at run time. Rebuilding this stack
  # changes the values, and nothing downstream needs editing.
  # After this, checkout the Jenkinsfile to edit the pipeline to read these values from SSM instead of hard-coding them.
  #
  # Only non-secret values: AWS::SSM::Parameter cannot create SecureString,
  # so DATABASE_URL and SECRET_KEY are set by CLI instead.

  AlbDnsParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /rmit/prod/ALB_DNS
      Type: String
      Value: !GetAtt Alb.DNSName

  SwarmMgrIpParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /rmit/prod/SWARM_MGR_IP
      Type: String
      Value: !GetAtt SwarmManager.PrivateIp

  StagingIpParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /rmit/staging/PRIVATE_IP
      Type: String
      Value: !GetAtt StagingServer.PrivateIp

  JenkinsIpParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /rmit/JENKINS_PRIVATE_IP
      Type: String
      Value: !GetAtt JenkinsServer.PrivateIp

Outputs:

  AlbDns:
    Description: Public address of the production site
    Value: !GetAtt Alb.DNSName

  JenkinsUrl:
    Description: Jenkins UI
    Value: !Sub "http://${JenkinsServer.PublicIp}:8080"

  StagingUrl:
    Value: !Sub "http://${StagingServer.PublicIp}:8081"

  SwarmManagerPrivateIp:
    Value: !GetAtt SwarmManager.PrivateIp
