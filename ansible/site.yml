---
- name: Configure all container hosts
  hosts: tag_Role_staging:tag_Role_swarm_manager:tag_Role_swarm_worker
  become: true
  roles:
    - docker

- name: Configure the staging deployment host
  hosts: tag_Role_staging
  become: true
  roles:
    - app

- name: Create the production Docker Swarm
  hosts: tag_Role_swarm_manager:tag_Role_swarm_worker
  become: true
  roles:
    - swarm
