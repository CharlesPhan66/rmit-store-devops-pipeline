---
# Which roles run where. No values live here on purpose: everything
# environment-specific is in group_vars/, so rebuilding the infrastructure with
# different addresses does not touch this file.
#
#   ansible-playbook site.yml                          # everything
#   ansible-playbook site.yml --limit tag_Role_staging
#   ansible-playbook site.yml --check --diff           # dry run
#
# Run it twice: the second run must report changed=0.
- name: Hosts that run containers
  hosts: all:!tag_Role_ansible
  become: true
  roles:
    - docker

- name: The Jenkins host
  hosts: tag_Role_jenkins
  become: true
  roles:
    - jenkins

- name: Staging host
  hosts: tag_Role_staging
  become: true
  roles:
    - app

- name: the swarm cluster
  hosts: tag_Role_swarm_manager:tag_Role_swarm_worker
  become: true
  roles:
    - swarm