---
- name: Install the required container engine
  ansible.builtin.dnf:
    name: docker
    state: present

- name: Start and enable the container service
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Add the EC2 login user to the container group
  ansible.builtin.user:
    name: ec2-user
    groups: docker
    append: true
