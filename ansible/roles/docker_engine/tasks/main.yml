---
- name: Install the required container engine
  ansible.builtin.dnf:
    name: "{{ docker_package_name }}"
    state: present

- name: Start and enable the container service
  ansible.builtin.service:
    name: "{{ docker_service_name }}"
    state: started
    enabled: true

- name: Add the EC2 login user to the container group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: "{{ docker_group_name }}"
    append: true
  loop: "{{ docker_users }}"
