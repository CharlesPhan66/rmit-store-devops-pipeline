---
- name: Initialize swarm on the first manager node
  ansible.builtin.command: >
    docker swarm init --advertise-addr {{ ansible_default_ipv4.address }}
  register: swarm_init
  changed_when: "'Swarm initialized' in swarm_init.stdout"
  failed_when:
    - swarm_init.rc != 0
    - "'already part of a swarm' not in swarm_init.stderr"
  when: "'tag_Role_swarm_manager' in group_names"

- name: Read the worker join token from the manager
  ansible.builtin.command: docker swarm join-token -q worker
  register: join_token
  changed_when: false
  delegate_to: "{{ groups['tag_Role_swarm_manager'][0] }}"
  run_once: true
  no_log: true

- name: Join the workers
  ansible.builtin.command: >
    docker swarm join --token {{ join_token.stdout }} 
    {{ hostvars[groups['tag_Role_swarm_manager'][0]].ansible_host }}:2377
  register: swarm_join
  changed_when: "'This node joined a swarm' in swarm_join.stdout"
  failed_when:
    - swarm_join.rc != 0
    - "'already part of a swarm' not in swarm_join.stderr"
  when: "'tag_Role_swarm_worker' in group_names"
  no_log: true

# swarm/stack.yml declares SECRET_KEY and DATABASE_URL as external secrets
- name: List the secrets the swarm already holds
  ansible.builtin.command:
    argv:
      - docker
      - secret
      - ls
      - --format
      - "{% raw %}{{ .Name }}{% endraw %}"
  register: swarm_secrets
  changed_when: false
  when: "'tag_Role_swarm_manager' in group_names"

# stdin_add_newline: false avoids a trailing newline: it becomes part of DATABASE_URL and can cause
# Django to resolve the database hostname incorrectly.

# Secret names must match the environment variables expected by the app.
# Docker secrets avoid exposing sensitive values in the Swarm raft log,
# unlike service-level --env variables.
- name: Create the missing secrets from SSM
  ansible.builtin.command:
    argv:
      - docker
      - secret
      - create
      - "{{ item.name }}"
      - "-"
    stdin: "{{ lookup('amazon.aws.aws_ssm', item.param, decrypt=true, region=aws_region) }}"
    stdin_add_newline: false
  loop:
    - { name: SECRET_KEY, param: /rmit/prod/SECRET_KEY }
    - { name: DATABASE_URL, param: /rmit/prod/DATABASE_URL }
    - { name: DJANGO_SUPERUSER_PASSWORD, param: /rmit/prod/ADMIN_PASSWORD }
  loop_control:
    label: "{{ item.name }}"
  when:
    - "'tag_Role_swarm_manager' in group_names"
    - item.name not in swarm_secrets.stdout_lines
  no_log: true
