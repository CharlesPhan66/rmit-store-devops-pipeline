---
# This replaces the user data script that is used when launching the EC2 instance manually.
- name: Install packages
  ansible.builtin.dnf:
    name:
      - docker
      - git
      - amazon-ecr-credential-helper
    state: present

- name: Enable and start docker service
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

- name: Add ec2-user to the docker group
  ansible.builtin.user:
    name: ec2-user
    groups: docker
    append: true

- name: Keep the hostname across reboots
  ansible.builtin.lineinfile:
    name: /etc/cloud/cloud.cfg
    line: "{{ preserve_hostname: true }}"
    create: true

- name: Set the hostname for the Name tag of the instance
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

- name: Point Docker at the ECR credential helper
  ansible.builtin.copy:
    dest: /home/ec2-user/.docker/config.json
    content: |
      {
        "credsStore": "ecr-login"
      }
    owner: ec2-user
    group: ec2-user
    mode: "0600"