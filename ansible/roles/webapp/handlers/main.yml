---
- name: Restart RMIT API
  ansible.builtin.service:
    name: "{{ webapp_service_name }}"
    state: restarted

- name: Validate and reload Nginx
  ansible.builtin.command: /usr/sbin/nginx -t
  changed_when: false
  notify: Reload Nginx

- name: Reload Nginx
  ansible.builtin.service:
    name: "{{ webapp_nginx_service }}"
    state: reloaded
