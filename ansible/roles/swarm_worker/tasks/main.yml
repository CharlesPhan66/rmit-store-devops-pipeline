---
- name: Inspect the local Swarm state
  ansible.builtin.command:
    argv:
      - docker
      - info
      - --format
      - "{% raw %}{{.Swarm.LocalNodeState}}{% endraw %}"
  register: swarm_worker_state
  changed_when: false

- name: Join the worker to the Swarm
  ansible.builtin.command:
    argv:
      - docker
      - swarm
      - join
      - --token
      - "{{ hostvars[groups['swarm_managers'][0]].swarm_worker_join_token.stdout }}"
      - "{{ hostvars[groups['swarm_managers'][0]].swarm_manager_endpoint }}"
  when: swarm_worker_state.stdout != "active"
  changed_when: true
  no_log: true
