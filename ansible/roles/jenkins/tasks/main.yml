# This replaces the user data of jenkins server
- name: Grow /tmp so the Jenkins node monitor stays happy
  ansible.posix.mount:
    path: /tmp
    src: tmpfs
    fstype: tmpfs
    opts: defaults,size=3G
    state: mounted

- name: Install Java 21 and the AWS CLI
  ansible.builtin.dnf:
    name:
      - java-21-amazon-corretto
      - awscli-2
    state: present

- name: Add the Jenkins repository
  ansible.builtin.get_url:
    url: https://pkg.jenkins.io/redhat-stable/jenkins.repo
    dest: /etc/yum.repos.d/jenkins.repo
    mode: '0644'

- name: Import the Jenkins repository GPG key
  ansible.builtin.rpm_key:
    key: https://pkg.jenkins.io/redhat-stable/jenkins.io-2023.key
    state: present

- name: Install Jenkins
  ansible.builtin.dnf:
    name: jenkins
    state: present

- name: Let the jenkins user reach the docker cli
  ansible.builtin.user:
    name: jenkins
    groups: docker
    append: true
  notify: restart jenkins

- name: Download the Jenkins plugin installation manager tool
  ansible.builtin.get_url:
    url: "https://github.com/jenkinsci/plugin-installation-manager-tool/releases/download/{{ jenkins_plugin_manager_version }}/jenkins-plugin-manager-{{ jenkins_plugin_manager_version }}.jar"
    dest: /opt/jenkins-plugin-manager.jar
    mode: '0644'
    timeout: 60
  register: jenkins_plugin_manager_download
  retries: 3
  delay: 5
  until: jenkins_plugin_manager_download is succeeded

- name: Locate the jenkins.war the dnf package installed
  ansible.builtin.command: find /usr -xdev -name jenkins.war
  register: jenkins_war_find
  changed_when: false

- name: Install the plugins Jenkinsfile and Configuration as Code need
  ansible.builtin.command:
    cmd: >-
      java -jar /opt/jenkins-plugin-manager.jar
      --war {{ jenkins_war_find.stdout_lines[0] }}
      --plugin-download-directory /var/lib/jenkins/plugins
      --plugins {{ jenkins_plugins | join(' ') }}
  become_user: jenkins
  register: jenkins_plugin_install
  changed_when: true
  notify: restart jenkins

- name: Fetch the secrets Configuration as Code needs, without ever logging them
  ansible.builtin.set_fact:
    jenkins_admin_password: "{{ lookup('amazon.aws.aws_ssm', '/rmit/JENKINS_ADMIN_PASSWORD', region=aws_region) }}"
    email_app_password: "{{ lookup('amazon.aws.aws_ssm', '/rmit/EMAIL_PASSWORD', region=aws_region) }}"
    github_pat: "{{ lookup('amazon.aws.aws_ssm', '/rmit/GITHUB_PAT', region=aws_region) }}"
  no_log: true

- name: Create the Configuration as Code directory
  ansible.builtin.file:
    path: /var/lib/jenkins/casc_configs
    state: directory
    owner: jenkins
    group: jenkins
    mode: '0750'

- name: Render the Configuration as Code definition (admin user, email, credentials, the pipeline job)
  ansible.builtin.template:
    src: jenkins-casc.yaml.j2
    dest: /var/lib/jenkins/casc_configs/jenkins.yaml
    owner: jenkins
    group: jenkins
    mode: '0640'
  notify: restart jenkins

- name: Remove the stale /etc/sysconfig/jenkins from earlier attempts
  ansible.builtin.file:
    path: /etc/sysconfig/jenkins
    state: absent

- name: Ensure the systemd drop-in directory for jenkins.service exists
  ansible.builtin.file:
    path: /etc/systemd/system/jenkins.service.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Feed the setup-wizard skip, timezone and secrets to Jenkins via a systemd override
  ansible.builtin.copy:
    dest: /etc/systemd/system/jenkins.service.d/override.conf
    owner: root
    group: root
    mode: '0600'
    content: |
      # ANSIBLE MANAGED - Configuration as Code
      # This Environment="JAVA_OPTS=..." replaces the unit's own JAVA_OPTS
      # (systemd applies later Environment= assignments for the same key
      # last), so java.awt.headless must be repeated here, not just appended.
      [Service]
      Environment="JAVA_OPTS=-Djava.awt.headless=true -Djenkins.install.runSetupWizard=false -Duser.timezone=Asia/Ho_Chi_Minh"
      Environment="CASC_JENKINS_CONFIG=/var/lib/jenkins/casc_configs/jenkins.yaml"
      Environment="JENKINS_ADMIN_PASSWORD={{ jenkins_admin_password }}"
      Environment="EMAIL_APP_PASSWORD={{ email_app_password }}"
      Environment="GITHUB_PAT={{ github_pat }}"
  no_log: true
  notify:
    - reload systemd
    - restart jenkins

- name: Apply the systemd override now, not at end-of-play
  ansible.builtin.meta: flush_handlers

- name: Enable and start the Jenkins service
  ansible.builtin.systemd:
    name: jenkins
    enabled: true
    state: started

- name: Wait for Jenkins to boot and finish applying Configuration as Code
  ansible.builtin.uri:
    url: "http://127.0.0.1:8080/api/json"
    url_username: "{{ jenkins_admin_user }}"
    url_password: "{{ jenkins_admin_password }}"
    force_basic_auth: true
    status_code: 200
  register: jenkins_ready
  until: jenkins_ready.status == 200
  retries: 30
  delay: 10
  no_log: true

- name: Give the jenkins user an SSH key
  ansible.builtin.user:
    name: jenkins
    generate_ssh_key: true
    ssh_key_type: ed25519
    ssh_key_file: .ssh/id_ed25519

- name: Read the public half
  ansible.builtin.slurp:
    src: /var/lib/jenkins/.ssh/id_ed25519.pub
  register: jenkins_pubkey

- name: Publish it so the deploy targets can authorise it
  ansible.builtin.command:
    argv:
      - aws
      - ssm
      - put-parameter
      - --region
      - "{{ aws_region }}"
      - --name
      - /rmit/JENKINS_PUBKEY
      - --type
      - String
      - --overwrite
      - --value
      - "{{ jenkins_pubkey.content | b64decode | trim }}"
  changed_when: false

- name: Note this run's webhook URL
  ansible.builtin.set_fact:
    jenkins_webhook_url: "http://{{ jenkins_public_ip }}:8080/github-webhook/"

- name: List the GitHub webhooks already registered on this repo
  ansible.builtin.uri:
    url: "https://api.github.com/repos/{{ github_owner }}/{{ github_repo }}/hooks"
    headers:
      Authorization: "Bearer {{ github_pat }}"
      Accept: "application/vnd.github+json"
    status_code: 200
  register: github_hooks
  no_log: true

- name: Remove any webhook still pointing at a previous Jenkins address
  ansible.builtin.uri:
    url: "https://api.github.com/repos/{{ github_owner }}/{{ github_repo }}/hooks/{{ item.id }}"
    method: DELETE
    headers:
      Authorization: "Bearer {{ github_pat }}"
      Accept: "application/vnd.github+json"
    status_code: 204
  loop: >-
    {{ github_hooks.json
       | selectattr('config.url', 'defined')
       | selectattr('config.url', 'search', '/github-webhook/')
       | rejectattr('config.url', 'equalto', jenkins_webhook_url)
       | list }}
  loop_control:
    label: "{{ item.id }}"
  no_log: true

- name: Register the GitHub push webhook that triggers this Jenkins job (README 2.4 step 7, done once, idempotently)
  ansible.builtin.uri:
    url: "https://api.github.com/repos/{{ github_owner }}/{{ github_repo }}/hooks"
    method: POST
    headers:
      Authorization: "Bearer {{ github_pat }}"
      Accept: "application/vnd.github+json"
    body_format: json
    body:
      name: web
      active: true
      events:
        - push
      config:
        url: "{{ jenkins_webhook_url }}"
        content_type: json
    status_code: 201
  when: >-
    github_hooks.json
    | selectattr('config.url', 'defined')
    | selectattr('config.url', 'equalto', jenkins_webhook_url)
    | list | length == 0
  no_log: true