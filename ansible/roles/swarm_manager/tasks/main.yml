---
- name: Inspect the local Swarm state
  ansible.builtin.command:
    argv:
      - docker
      - info
      - --format
      - "{% raw %}{{.Swarm.LocalNodeState}}{% endraw %}"
  register: swarm_manager_state
  changed_when: false

- name: Initialize the Swarm manager
  ansible.builtin.command:
    argv:
      - docker
      - swarm
      - init
      - --advertise-addr
      - "{{ swarm_manager_advertise_addr }}"
  when: swarm_manager_state.stdout != "active"
  changed_when: true

- name: Record the manager endpoint for worker nodes
  ansible.builtin.set_fact:
    swarm_manager_endpoint: "{{ swarm_manager_advertise_addr }}:{{ swarm_manager_port }}"

- name: Read the worker join token
  ansible.builtin.command:
    argv:
      - docker
      - swarm
      - join-token
      - -q
      - worker
  register: swarm_worker_join_token
  changed_when: false
  no_log: true
