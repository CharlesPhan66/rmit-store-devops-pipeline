---
- name: Configure Docker on every Swarm node
  hosts: swarm_nodes
  become: true

  roles:
    - docker_engine

- name: Initialize the Swarm manager
  hosts: swarm_managers
  become: true

  roles:
    - swarm_manager

- name: Join the Swarm workers
  hosts: swarm_workers
  become: true

  roles:
    - swarm_worker
