---
- name: Deploy the public-image Swarm rehearsal
  hosts: swarm_managers
  become: true

  vars:
    rehearsal_stack_name: g3-rehearsal
    rehearsal_directory: /opt/g3-rehearsal
    rehearsal_stack_path: "{{ rehearsal_directory }}/stack.yml"

  tasks:
    - name: Create the rehearsal directory
      ansible.builtin.file:
        path: "{{ rehearsal_directory }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Copy the rehearsal stack definition
      ansible.builtin.copy:
        src: ../../swarm/rehearsal-stack.yml
        dest: "{{ rehearsal_stack_path }}"
        owner: root
        group: root
        mode: "0644"
      register: rehearsal_stack_file

    - name: Check whether the rehearsal stack exists
      ansible.builtin.command:
        argv:
          - docker
          - stack
          - services
          - "{{ rehearsal_stack_name }}"
      register: rehearsal_stack_status
      changed_when: false
      failed_when: false

    - name: Deploy or update the rehearsal stack
      ansible.builtin.command:
        argv:
          - docker
          - stack
          - deploy
          - --compose-file
          - "{{ rehearsal_stack_path }}"
          - "{{ rehearsal_stack_name }}"
      when: rehearsal_stack_file.changed or rehearsal_stack_status.rc != 0
      changed_when: true

    - name: Verify the published rehearsal service
      ansible.builtin.uri:
        url: http://127.0.0.1:8080/
        status_code: 200
      register: rehearsal_http_result
      retries: 10
      delay: 2
      until: rehearsal_http_result.status == 200
