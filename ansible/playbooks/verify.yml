---
- name: Verify the G3 baseline configuration
  hosts: g3_targets
  become: true

  tasks:
    - name: Collect service states
      ansible.builtin.service_facts:

    - name: Verify Docker and Nginx are active
      ansible.builtin.assert:
        that:
          - ansible_facts.services['docker.service'].state == 'running'
          - ansible_facts.services['nginx.service'].state == 'running'
        fail_msg: Docker or Nginx is not running
        success_msg: Docker and Nginx are running

    - name: Validate the Nginx configuration
      ansible.builtin.command: /usr/sbin/nginx -t
      changed_when: false

    - name: Read the Docker version
      ansible.builtin.command: docker --version
      register: docker_version_result
      changed_when: false

    - name: Read the Python version
      ansible.builtin.command: python3.11 --version
      register: python_version_result
      changed_when: false

    - name: Read the PostgreSQL client version
      ansible.builtin.command: psql --version
      register: psql_version_result
      changed_when: false

    - name: Verify the local Nginx landing page
      ansible.builtin.uri:
        url: http://127.0.0.1/
        status_code: 200
        return_content: true
      register: nginx_verify_response
      failed_when: nginx_rehearsal_title not in nginx_verify_response.content
      vars:
        nginx_rehearsal_title: G3 Ansible Nginx rehearsal

    - name: Display installed tool versions
      ansible.builtin.debug:
        msg:
          - "{{ docker_version_result.stdout }}"
          - "{{ python_version_result.stdout }}"
          - "{{ psql_version_result.stdout }}"
