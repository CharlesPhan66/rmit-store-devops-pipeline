---
# Variables for the staging host. The group name comes from the EC2 tag
# Role=staging, so renaming the machine itself changes nothing here.
# Only repo_url is typed by hand. Everything else is derived from the inventory
# or read from SSM, so this file survives the infrastructure being rebuilt with
# different addresses.

ssm_prefix: /rmit/staging

repo_url: git@github.com:rmit-vietnam-computing-technologies/2026b-cosc2767-a2-sg-team-13.git

# "…/repo-name.git" -> "/home/ec2-user/repo-name"
repo_dir: "/home/ec2-user/{{ repo_url.split('/')[-1] | replace('.git', '') }}"

# Derived from the inventory, so no IP is ever written down. ansible_host is the
# private IP the aws_ec2 plugin returned — the same address the Jenkins smoke
# stage calls, which is exactly what ALLOWED_HOSTS has to contain.
allowed_hosts: "{{ ansible_host }},127.0.0.1,localhost"
client_url: "http://{{ ansible_host }}:8081"

# Written to SSM by cloudformation/data.yml. Note the absolute path: the bucket
# is shared by staging and production, so it lives at the root of the namespace
# and NOT under ssm_prefix. Only the three secrets in roles/app are per-environment.
# Until the data stack exists, put it there by hand:
#   aws ssm put-parameter --name /rmit/MEDIA_BUCKET --type String --value <bucket>
media_bucket: "{{ lookup('amazon.aws.aws_ssm', '/rmit/MEDIA_BUCKET') }}"
