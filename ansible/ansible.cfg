[defaults]
# As default, the inventory file location can be found by (ansible-config dump | grep DEFAULT_HOST_LIST)
# Usually it is /etc/ansible/hosts, but we can change it to our own inventory file
inventory = inventory/aws_ec2.yml
host_key_checking = False
private_key_file = ~/.ssh/ansible_rmit
remote_user = ec2-user
stdout_callback = yaml

[inventory]
enable_plugins = amazon.aws.aws_ec2