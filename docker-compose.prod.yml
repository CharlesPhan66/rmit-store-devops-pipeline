# Author: Charles
# RMIT Store - the whole stack on one host.
#
# Build the two images FIRST, then bring the stack up. This file has no
# `build:` section anywhere: it only runs images, it never produces them.
#
#   docker build -f docker/api.Dockerfile    --target runtime -t rmit-api:local .
#   docker build -f docker/client.Dockerfile                  -t rmit-client:local .
#
#   docker compose --env-file compose.env -f docker-compose.prod.yml up -d
#   docker compose --env-file compose.env -f docker-compose.prod.yml ps
#   docker compose --env-file compose.env -f docker-compose.prod.yml down
#   docker compose --env-file compose.env -f docker-compose.prod.yml down -v
#
# Both flags are required on EVERY command, not just up:
#   --env-file  because POSTGRES_PASSWORD below is interpolated into this YAML,
#               and Compose re-parses the file on each invocation
#   -f          because without it Compose reads docker-compose.yml, the dev stack
#
# Why build is separate from up:
#   - `docker compose --build` delegates to buildx, which `dnf install docker`
#     on AL2023 does not provide. Plain `docker build` needs no plugin.
#   - Production must run the image that was tested, not one rebuilt on the box.
#     Once Jenkins exists it builds once, tags by commit, and every environment
#     runs that exact tag. A compose file that can rebuild defeats that.
#   - Docker Swarm ignores `build:` outright, so swarm/stack.yml cannot have one.
#     Keeping this file build-free means it already has the shape Swarm needs.
#
# Difference from docker-compose.yml:
#   - config.settings.prod instead of dev: DEBUG off, ALLOWED_HOSTS enforced,
#     browsable API off, secure-cookie defaults on.
#   - USE_S3=true: uploaded images go to the S3 bucket, not container disk.
#   - Configuration comes from compose.env, which is NOT committed. (Modify compose.env.example and copy it to compose.env, then fill in the values.)
#   - Published on 8081, so it can run beside the dev stack on 8080. (Remember to open 8081 in the security group.)
#
# Prerequisites, all from Plan C / Plan D:
#   - an RDS endpoint, reachable from this instance's security group on 5432
#   - an S3 bucket, and an IAM instance profile on this EC2 (no AWS keys anywhere)
#   - compose.env, written by hand on the box - see plan-e-compose-prod.md
#
# Three services, not four. The database is managed infrastructure now, which is
# what production actually looks like. The dev stack keeps its db container
# because its job is to come up anywhere Docker runs, with no AWS at all.

name: rmit-store-prod

services:

  # --- Database --------------------------------------------------------------
  # To use RDS instead: delete this whole service, delete the depends_on block
  # in migrate, and point DATABASE_URL in compose.env at the RDS endpoint.
  # However, the RDS instance must be running long before this stack starts, so there is nothing to wait for.
  # But for testing purposes, let say you want to compose up quickly to see if the stack works, you can use a db container here. Just remember to delete it before you deploy to AWS.
  # Ideally for staging, db container should be removed and use RDS instead. The db container is only for testing purposes.
  # However, you should figure out a way to set RDS up as a service in the compose file,
  # so that you can compose up and down the whole stack including RDS, no need to manually set up RDS
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rmit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: rmit_store
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rmit -d rmit_store"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- Migrations ------------------------------------------------------------
  # Same image as api - same build, only the command differs.
  migrate:
    image: rmit-api:local
    command: python manage.py migrate --noinput
    # Because S3 is used, instead of having environment:, we use env_file: to load the environment variables from compose.env, which is not committed to git. This is to avoid exposing sensitive information like AWS keys and RDS password in the source code.
    env_file:
      - ./compose.env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # --- API -------------------------------------------------------------------
  api:
    # Built by the `docker build --target runtime` command in the header.
    # `--target runtime` is compulsory: stage `test` sits at the end of
    # api.Dockerfile, and Docker uses the LAST stage when no target is given.
    image: charlesphan66/rmit-api:${IMAGE_TAG:-latest}
    # env_file instead of environment: to load the environment variables from compose.env, which is not committed to git. This is to avoid exposing sensitive information like AWS keys and RDS password in the source code.
    env_file:
      - ./compose.env
    depends_on:
      migrate:
        condition: service_completed_successfully
    # /readyz/ checks the database AND the storage backend, so with USE_S3=true
    # this also proves the container can reach the bucket. If it stays 503 while
    # `aws s3 ls` works on the host, read the IMDS hop limit section of the plan.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz/')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # --- Frontend --------------------------------------------------------------
  client:
    image: charlesphan66/rmit-client:${IMAGE_TAG:-latest}
    environment:
      API_BASE_URL: /api
    volumes:
      # Same file as the dev stack. Its /media/ block simply never receives a
      # request here: with USE_S3=true the browser fetches images straight from
      # the bucket, so those URLs never come back to nginx at all.
      - ./docker/client-nginx-compose.conf:/etc/nginx/conf.d/default.conf:ro
    # Different port from the dev stack, so they can run side by side on one host.
    ports:
      - "8081:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:

# No media volume anywhere in this file, and that is the point. Uploaded images
# live in S3, so every replica reads the same bucket and `--scale api=2` shows
# no broken images at all. That is the fix the dev stack demonstrates the need
# for.
