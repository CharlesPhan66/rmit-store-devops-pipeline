# Purpose: Tell pytest how to run the tests for the backend Django app.
[pytest]
DJANGO_SETTINGS_MODULE = config.settings.dev

# As the requirement of the assignment, all the pipeline configs (tests, dockers, etc.) sit outside the app folder.
# Therefoẻ, we need to have pythonpath to tell pytest the location of app/server folder
pythonpath = app/server

# also as the requirement of the asm, all the tests sit outside, so we need to tell pytest where to find them
testpaths = tests

# Tell the format of the test files. We use the convention of starting test files with "test_"
# E.g., test_admin.py, test_models.py, test_views.py, etc.
python_files = test_*.py

# This helps pytest to be strict about the markers we define, so that we don't accidentally use undefined markers in our tests.
# example you have @pytest.mark.slw instead of @pytest.mark.slow, if you don't have --strict-markers, pytest will not complain and will just ignore the typo
# This can lead to confusion and tests not being run as expected.
# -p no:warnings (from danzel/testing) keeps third-party DeprecationWarnings out of the report.
addopts = --strict-markers -p no:warnings

# We define custom markers to categorize our tests (e.g., place @pytest.mark.unit on unit tests, @pytest.mark.integration on integration tests, etc.)
# This helps us to run specific categories of tests as needed.
# Let's say in case Jenkins is required to run only unit tests.
markers =
    unit: do not require database and network, can run in isolation
    integration: can use database
    smoke: run when an URL is requested, but not the full test suite
    e2e: end-to-end acceptance tests
